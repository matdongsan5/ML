<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Monkey Classifier</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: url("{{ url_for('static', filename='monkey_bg.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            text-align: center;
            padding: 30px;
            color: #fff;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .upload-section {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
            margin-top: 30px;
            width: 400px;
        }
        input[type="file"] {
            margin-bottom: 15px;
            font-size: 16px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            text-align: center;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        img {
            margin-top: 20px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }
        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #2d89ef;
        }
    </style>
</head>
<body>

    <h1>🐵 Monkey Classifier 🐵</h1>

    <div class="upload-section">
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*"><br>
            <input type="submit" value="이미지 업로드 및 예측">
        </form>
        <div style="margin-top: 20px;">
            <a href="{{ url_for('show_predictions') }}">
                <button type="button" style="
                    background-color: #2196F3;
                    color: white;
                    border: none;
                    padding: 10px 20px;
                    font-size: 16px;
                    border-radius: 8px;
                    cursor: pointer;
                ">
                    저장된 예측 보기
                </button>
            </a>
        </div>
        {% if prediction %}
            <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="업로드한 이미지">
            <div class="result">
                예측: {{ prediction }}<br>
                확신도: {{ confidence | round(2) }}%
            </div>
        {% endif %}
    </div>

</body>
</html>
