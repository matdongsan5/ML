<!DOCTYPE html>
<html lang="en">

    <title>[pre]</title>
</head>
<body>
    <div style='width:400px;
                height:800;  
                border:1px solid black;
                background-color :yellow'>
        pre 태그 : 
        입력한 데이터 그대로 화면에 출력<br>
         <h4> 서시 </h4>
    <h5 align="right"> 윤동주 </h5>
   <pre>
    죽는 날까지 하늘을 우러러
   한 점 부끄럼이 없기를,
   잎새에 이는 바람에도
   나는 괴로워했다.
   별을 노래하는 마음으로
   모든 죽어 가는 것을 사랑해야지
   그리고 나한테 주어진 길을
   걸어가야겠다.
   
   오늘 밤에도 별이 바람에 스치운다.
</pre>
    </div>
