<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <pre>
    * 컨테이너 태그란?
        여러 태그들을 묶어서 하나의 영역으로 관리하는 태그
        관련성 있는 내용 부분을 영역으로 지정
</pre>
<!-- style 속성: 태그에 여러가지 시각적인 디자인적인 부분 지정하는 속성 -->
<div style="background-color:bisque;">div1</div>
<div style="background-color:rgb(39, 134, 126);">div2</div>

<!-- span 특정 부분만 지정 -->
<div style="background-color:bisque;"><span style="background-color: aquamarine;">span</span></div>
</body>
</html>
